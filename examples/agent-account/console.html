<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGP 智能体授权</title>
<style>
body{font:16px/1.55 system-ui;background:#f3f5f7;color:#20303e;margin:2rem auto;padding:0 1rem;max-width:48rem}
section{background:white;border:1px solid #d3dae0;border-radius:.6rem;margin:1rem 0;padding:1rem}
label{display:block;margin:.6rem 0}input{display:block;width:95%;padding:.5rem;font:inherit}
button{font:inherit;padding:.4rem .8rem;margin:.4rem .3rem .4rem 0}output{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<h1>智能体采购授权</h1>
<section><h2>账户</h2>
<label>网络链 ID<input id="chain" value="860621" inputmode="numeric"></label>
<label>智能账户合约<input id="account" placeholder="0x…"></label>
<label>智能体会话地址<input id="agent" placeholder="0x…"></label>
<button id="inspect">查看授权</button>
<output id="grant"></output></section>
<section><h2>设置采购权限</h2>
<label>服务收款地址<input id="target" placeholder="0x…"></label>
<label>合约调用数据（普通付款留空）<input id="callData" placeholder="0x…"></label>
<label>原生币预算（wei）<input id="budget" inputmode="numeric"></label>
<label>到期时间（本地时间）<input id="expiry" type="datetime-local"></label>
<button id="authorize">钱包确认授权</button><button id="pause">暂停采购</button><button id="resume">恢复采购</button><button id="revoke">撤销授权</button></section>
<section><h2>多签账户密钥恢复</h2>
<label>待替换的多签成员地址<input id="oldMember" placeholder="0x…"></label>
<label>新成员地址<input id="newMember" placeholder="0x…"></label>
<button id="recoveryStatus">查看恢复进度</button><button id="recoveryApprove">同意替换</button>
<button id="recoveryWithdraw">撤回同意</button><button id="recoveryExecute">执行替换</button></section>
<section><h2>采购支出</h2>
<label>截止区块（留空查最近 500 个区块）<input id="endBlock" inputmode="numeric"></label>
<button id="history">查看支出明细</button><br><output id="payments" aria-live="polite"></output></section>
<section><h2>交易状态</h2><label>交易哈希<input id="hash" placeholder="0x…"></label>
<button id="receipt">查询回执</button><br><output id="feedback" role="status"></output></section>
<script type="module">
const el = id => document.getElementById(id);
const address = id => {
  const value = el(id).value.trim();
  if (!/^0x[0-9a-f]{40}$/i.test(value) || BigInt(value) === 0n) throw Error('请填写有效地址');
  return value.toLowerCase();
};
const word = n => BigInt(n).toString(16).padStart(64, '0');
const emptyDataHash = 'c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470';
const rpc = (method, params = []) => window.ethereum.request({ method, params });
async function recoverMember(action, chain) {
  const account = address('account'), previous = address('oldMember'), replacement = address('newMember');
  if (previous === replacement) throw Error('新地址和待替换地址须不同');
  const read = (to, data) => rpc('eth_call', [{to, data}, 'latest']);
  const owner = await read(account, '0x8da5cb5b');
  if (!/^0x0{24}[0-9a-f]{40}$/i.test(owner)) throw Error('无法读取智能账户的所有者');
  const council = '0x' + owner.slice(-40);
  const quorum = await read(council, '0x1703a018');
  if (!/^0x[0-9a-f]{64}$/i.test(quorum) || BigInt(quorum) < 2n) throw Error('该账户未配置受支持的多签控制合约');
  const isMember = async addr => BigInt(await read(council, '0xe7d4539e' + word(addr))) === 1n;
  if (!await isMember(previous)) return '待替换地址当前不属于多签成员';
  if (await isMember(replacement)) throw Error('新地址已是多签成员');
  // All members derive the same rotation proposal within the council's current epoch.
  const rotate = '9e1e2c46' + word(previous) + word(replacement);
  const tail = word(rotate.length / 2) + rotate.padEnd(192, '0');
  const args = word(council) + word(96) + word(0) + tail;
  if (action === 'recoveryStatus') {
    const id = await read(council, '0x7999f2e1' + args);
    const state = await read(council, '0x32ed5b12' + id.slice(2));
    if (!/^0x[0-9a-f]{192}$/i.test(state)) throw Error('无法读取恢复提案');
    const [votes, readyAt] = state.slice(2).match(/.{64}/g).map(x => BigInt('0x' + x));
    const lines = ['恢复提案 ' + id, '同意票 ' + votes + ' / ' + BigInt(quorum)];
    if (readyAt) lines.push('可执行时间 ' + new Date(Number(readyAt) * 1000).toLocaleString());
    return lines.join('\n');
  }
  const [from] = await rpc('eth_requestAccounts');
  let data = '0xc97b247c' + args;
  if (action !== 'recoveryExecute') {
    if (!await isMember(from)) throw Error('请连接当前多签成员钱包');
    data = '0x23e4491c' + word(council) + word(128) + word(0) + word(action === 'recoveryApprove' ? 1 : 0) + tail;
  }
  await rpc('eth_call', [{from, to:council, data}, 'latest']);
  el('hash').value = await rpc('eth_sendTransaction', [{from, to:council, data, chainId:chain}]);
  return '已提交密钥恢复操作，请查询交易回执';
}
async function invoke(action) {
  if (!window.ethereum) throw Error('请在已连接 EVM 钱包的浏览器中打开');
  const chain = await rpc('eth_chainId');
  if (BigInt(chain) !== BigInt(el('chain').value)) throw Error('请在钱包中切换到所填网络');
  if (action.startsWith('recovery')) return recoverMember(action, chain);
  if (action === 'receipt') {
    const hash = el('hash').value.trim();
    if (!/^0x[0-9a-f]{64}$/i.test(hash)) throw Error('请填写完整交易哈希');
    const r = await rpc('eth_getTransactionReceipt', [hash]);
    if (!r) return '等待节点返回回执';
    const lines = ['交易' + (BigInt(r.status) ? '执行成功' : '执行失败') + '，区块 ' + BigInt(r.blockNumber)];
    if (r.from) lines.push('交易费用支付方 ' + r.from);
    if (r.gasUsed != null && r.effectiveGasPrice != null) {
      lines.push('整笔交易执行费 ' + (BigInt(r.gasUsed) * BigInt(r.effectiveGasPrice)) + ' wei');
    }
    try {
      const finalized = await rpc('eth_getBlockByNumber', ['finalized', false]);
      const canonical = await rpc('eth_getBlockByNumber', [r.blockNumber, false]);
      if (!canonical || canonical.hash.toLowerCase() !== r.blockHash.toLowerCase()
          || (finalized && BigInt(finalized.number) === BigInt(r.blockNumber)
              && finalized.hash.toLowerCase() !== r.blockHash.toLowerCase())) {
        return '回执对应的区块已变化，请重新查询交易';
      }
      if (!finalized) lines.push('节点未提供最终确认状态');
      else if (BigInt(finalized.number) < BigInt(r.blockNumber)) lines.push('等待最终确认');
      else lines.push('已最终确认');
    } catch {
      lines.push('节点未提供最终确认状态');
    }
    return lines.join('\n');
  }
  const to = address('account'), agent = address('agent');
  const call = data => rpc('eth_call', [{to, data}, 'latest']);
  if (action === 'history') {
    el('payments').textContent = '';
    const upper = BigInt(await rpc('eth_blockNumber'));
    const input = el('endBlock').value.trim();
    if (input && !/^[0-9]+$/.test(input)) throw Error('截止区块须为非负整数');
    const end = input ? BigInt(input) : upper;
    if (end > upper) throw Error('截止区块高于当前链头');
    const start = end < 499n ? 0n : end - 499n;
    const eventId = '0x37db9851b6c9a32f8ddcf4734e6526de7c85268ef735f7883ea70dc8a39c9c85';
    const logs = await rpc('eth_getLogs', [{address:to, fromBlock:'0x'+start.toString(16),
      toBlock:'0x'+end.toString(16), topics:[eventId, null, '0x'+word(agent)]}]);
    const entries = logs.filter(log => !log.removed);
    const rows = entries.slice().reverse().map(log => [
      '区块 ' + BigInt(log.blockNumber) + ' · ' + BigInt(log.data) + ' wei',
      '收款方 0x' + log.topics[3].slice(-40), '任务 ' + log.topics[1], '交易 ' + log.transactionHash
    ].join('\n'));
    const total = entries.reduce((sum, log) => sum + BigInt(log.data), 0n);
    el('payments').textContent = ['区块 ' + start + '–' + end + ' · ' + rows.length + ' 笔 · 合计 ' + total + ' wei',
      ...rows].join('\n\n');
    return start ? '查询更早记录可填写截止区块 ' + (start - 1n) : '已查到创世区块';
  }
  if (action === 'inspect') {
    el('grant').textContent = '';
    const block = await rpc('eth_getBlockByNumber', ['latest', false]);
    const at = {blockHash:block.hash, requireCanonical:true};
    const readGrant = selector => rpc('eth_call', [{to, data:selector + word(agent)}, at]);
    const data = await readGrant('0xb869cea3');
    if (!/^0x[0-9a-f]{320}$/i.test(data)) throw Error('无法读取授权，请检查合约地址');
    const [target, operation, remaining, expiry, generation] = data.slice(2).match(/.{64}/g);
    if (BigInt('0x'+target) === 0n) return '该会话地址尚未获得采购授权';
    const now = BigInt(block.timestamp);
    let end = BigInt('0x'+expiry), state = end > now ? '有效' : '已到期';
    if (end === 0n) {
      end = BigInt(await readGrant('0x851c1f81'));
      if (end === 0n) state = '已撤销';
      else state = end > now ? '已暂停，可恢复' : '暂停期间已到期，需重新授权';
    }
    const lines = ['授权状态 ' + state, '收款方 0x' + target.slice(-40),
      operation.toLowerCase() === emptyDataHash ? '允许操作 普通付款' : '允许的合约调用数据哈希 0x' + operation,
      '剩余预算 ' + BigInt('0x'+remaining) + ' wei', '授权版本 ' + BigInt('0x'+generation)];
    if (end) lines.push('到期时间（Unix 秒）' + end);
    el('grant').textContent = lines.join('\n');
    return '已读取当前链上授权';
  }
  if (!['authorize', 'revoke', 'pause', 'resume'].includes(action)) throw Error('未知操作');
  const [from] = await rpc('eth_requestAccounts');
  if ((await call('0x8da5cb5b')).slice(-40).toLowerCase() !== from.slice(2).toLowerCase()) throw Error('请连接账户所有者钱包');
  let data = '0x74a8f103' + word(agent);
  if (action === 'pause' || action === 'resume') data = '0x89eba0d2' + word(agent) + word(action === 'pause' ? 1 : 0);
  if (action === 'authorize') {
    const n = el('budget').value.trim(), expiry = Date.parse(el('expiry').value);
    const payload = el('callData').value.trim() || '0x';
    if (!/^0x(?:[0-9a-f]{2})*$/i.test(payload)) throw Error('请填写完整的十六进制调用数据');
    if (n === '0' && payload === '0x') throw Error('普通付款的预算应大于零');
    if (!/^(0|[1-9][0-9]*)$/.test(n) || BigInt(n) >= 2n**256n) throw Error('预算须为有效的 wei 整数');
    if (!(expiry > Date.now())) throw Error('到期时间须晚于当前时间');
    const operationHash = payload === '0x' ? emptyDataHash : (await rpc('web3_sha3', [payload])).slice(2);
    if (!/^[0-9a-f]{64}$/i.test(operationHash)) throw Error('节点未返回有效的调用数据哈希');
    data = '0x5d9bde97' + word(agent) + word(address('target')) + operationHash + word(n) + word(Math.floor(expiry/1000));
  }
  el('hash').value = await rpc('eth_sendTransaction', [{from, to, data, chainId:chain}]);
  return '已提交，点击查询回执查看执行结果';
}
for (const b of document.querySelectorAll('button')) b.onclick = async () => {
  b.disabled = true;
  try { el('feedback').textContent = await invoke(b.id); }
  catch (e) { el('feedback').textContent = e.message; }
  finally { b.disabled = false; }
};
</script></html>
