name: Build Test

on:
  push:
    branches: 
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

jobs:
  unit-test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify third_party checksums
      run: |
        ( cd third_party/elastos-ela \
            && sha256sum -c ../elastos-ela.SHA256SUMS \
            && diff <(sed -e 's/^[0-9a-f]\{64\}  //' -e 's|^\./||' ../elastos-ela.SHA256SUMS | LC_ALL=C sort) \
                    <(git ls-files --cached --others --exclude-standard . | LC_ALL=C sort) )
        ( cd third_party/elastos-ela-spv \
            && sha256sum -c ../elastos-ela-spv.SHA256SUMS \
            && diff <(sed -e 's/^[0-9a-f]\{64\}  //' -e 's|^\./||' ../elastos-ela-spv.SHA256SUMS | LC_ALL=C sort) \
                    <(git ls-files --cached --others --exclude-standard . | LC_ALL=C sort) )

    - uses: actions/cache@v4
      with:
        # In order:
        # * Module download cache
        # * Build cache (Linux)
        # * Build cache (Mac)
        # * Build cache (Windows)
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Test Build
      run: |
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps
        go mod download && make geth
